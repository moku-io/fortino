[package]
name = "fortino-sslvpn"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Native FortiGate SSL VPN worker: TLS login, tunnel settings and in-process PPP"

[dependencies]
fortino-config.workspace = true
fortino-core.workspace = true
fortino-platform.workspace = true
fortino-proto-sslvpn.workspace = true
fortino-tls.workspace = true
fortino-secret.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types = { workspace = true, features = ["std"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
rand.workspace = true
sha2.workspace = true
serde_json.workspace = true

[dev-dependencies]
fortino-mock.workspace = true
fortinod = { path = "../fortinod" }
tempfile = "3"
tokio.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Creates the utun interface. Route management is disabled: the daemon owns routes.
tun-rs = { version = "2.8.18", features = ["async_tokio"] }
